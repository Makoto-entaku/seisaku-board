<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Radix10周年 寄せ書き</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* layout: sticky toolbar → card grid sorted by fewest messages → slide-up memory sheet with composer */
:root{--bg:#ffffff;--surface:#ffffff;--fg:#111111;--muted:#6b6b6b;--line:#e6e6e6;--accent:#111111;--accent-soft:#f3f3f3;--ok:#111111;--ok-soft:#f3f3f3;--shadow:0 10px 40px rgba(0,0,0,.14);
--sans:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;--round:"Zen Kaku Gothic New","Hiragino Sans",var(--sans);--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0d;--surface:#161616;--fg:#f2f2f2;--muted:#9a9a9a;--line:#2a2a2a;--accent:#f2f2f2;--accent-soft:#1d1d1d;--ok:#f2f2f2;--ok-soft:#1d1d1d;--shadow:0 10px 40px rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px}
header h1{font-family:var(--round);font-size:clamp(22px,4vw,30px);margin:0;letter-spacing:.02em;text-wrap:balance}
header p{color:var(--muted);margin:6px 0 0;max-width:62ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;margin-top:12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.me{display:flex;gap:6px;align-items:center;background:var(--accent-soft);padding:4px 6px 4px 12px;border-radius:999px}
.me label{font-size:12px;color:var(--muted);white-space:nowrap}
.me input{border:0;background:transparent;min-width:0;width:11em;padding:4px 0}
input[type=search]{flex:1 1 180px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.seg{display:flex;border:1px solid var(--fg);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--fg)}
.seg button.on{background:var(--fg);color:var(--bg)}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.big{display:flex;justify-content:center;text-align:center;margin:36px 0 16px}
.big div{display:flex;flex-direction:column;align-items:center;gap:4px}
.big b{font-family:var(--sans);font-weight:700;font-size:clamp(96px,22vw,180px);line-height:.9;color:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.big span{font-size:15px;color:var(--muted);letter-spacing:.06em}.big i{font-style:normal}
.stat{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex-basis:100%}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px 10px;margin-top:18px}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 12px;border-radius:16px;border:1px solid transparent;background:none;cursor:pointer;text-align:center;min-width:0;position:relative}
.card:hover{background:var(--surface);border-color:var(--line)}
.av{width:76px;height:76px;border-radius:18px;background:var(--line);overflow:hidden;display:grid;place-items:center;font-weight:700;color:var(--muted);font-size:20px;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.nm{font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.cnt{font-family:var(--mono);font-size:11px;padding:1px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.cnt.zero{background:var(--fg);color:var(--bg)}
.cnt.mine{background:transparent;color:var(--fg);border:1px solid var(--fg)}
.card.cur .av{outline:2px solid var(--ok);outline-offset:2px}
.sec{font-family:var(--round);font-size:15px;margin:26px 0 0;display:flex;gap:8px;align-items:baseline}
.sec small{font-family:var(--mono);color:var(--muted);font-weight:500}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,15,10,.45);z-index:20}
.sheet{position:fixed;z-index:21;left:50%;transform:translateX(-50%);bottom:0;width:min(720px,100%);max-height:92dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow);padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translate(-50%,40px);opacity:0}}}
.sh-top{display:flex;gap:14px;align-items:center}
.sh-top .av{width:64px;height:64px}
.sh-top h2{font-family:var(--round);margin:0;font-size:20px}
.sh-top .sub{color:var(--muted);font-size:12px}
.x{margin-left:auto;border:0;background:var(--line);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;flex:none}
.photos{display:flex;gap:10px;overflow-x:auto;margin:0 -4px;padding:0 4px 6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.photos figure{scroll-snap-align:start}
.photos figure{margin:0;flex:none}
.photos img{cursor:zoom-in;height:240px;width:auto;border-radius:12px;display:block;background:var(--line)}
.photos figcaption{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px;font-weight:700}
.post p{margin:0;font-size:14px;overflow-wrap:anywhere}
.post .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.rel{display:flex;gap:8px;flex-wrap:wrap}
.rel button{display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px 3px 3px;font-size:12px;cursor:pointer}
.rel .av{width:26px;height:26px;border-radius:50%;font-size:10px}
.compose{margin-top:20px;background:var(--accent-soft);border-radius:16px;padding:14px}
.compose h3{margin-top:0;color:var(--accent)}
.hint-lead{margin:0 0 4px;font-size:13px;color:var(--muted)}
.hints{margin:0 0 10px;padding-left:1.2em;font-size:13px;line-height:1.7}
.post{background:var(--accent-soft);border:0;border-radius:16px;padding:14px 16px;margin:0 0 12px}
.post .cover{font-family:var(--sans);font-weight:700;color:var(--fg);font-size:clamp(18px,2.4vw,21px);line-height:1.55;margin:0 0 12px;overflow-wrap:anywhere}
.post .pp{display:flex;gap:6px;margin:0 0 10px;overflow-x:auto}
.post .pp img{height:200px;width:auto;max-width:100%;min-width:120px;object-fit:cover;border-radius:10px;background:var(--line);cursor:zoom-in;display:block;flex:none}
.post p{color:var(--fg);font-size:14px;line-height:1.75}
.btn.small{padding:6px 12px;font-size:13px}
h3 small{font-weight:400;margin-left:8px;letter-spacing:0}
.post p{white-space:pre-line}
.post.open p{display:block;-webkit-line-clamp:unset;color:var(--fg)}
.more{border:0;background:none;color:var(--accent);font-size:12px;padding:2px 0;cursor:pointer}
.photos.b img{height:200px}
.tabs{display:flex;gap:4px;margin:18px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
.tabs span{font-family:var(--mono);font-size:11px;margin-left:4px}
.board{columns:2 220px;column-gap:10px}
.tile{break-inside:avoid;display:block;width:100%;background:var(--accent-soft);border-radius:14px;padding:14px;margin:0 0 10px;text-align:left;border:0}
.tile p{margin:0 0 8px;white-space:pre-line;font-size:15px;line-height:1.7}
.tile .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.tile.add{background:var(--fg);color:var(--bg);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px;font-weight:700;font-size:15px;gap:4px}
.tile.add span{font-size:34px;line-height:1;font-weight:400}
.cb{margin:0 0 12px;background:var(--accent-soft)}
.cb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.x.sm{width:28px;height:28px;font-size:15px;margin:0}
.cb textarea{min-height:140px;font-size:15px}
.hintd{margin:8px 0 0;font-size:13px;color:var(--muted)}.hintd summary{cursor:pointer}
.row.end{justify-content:flex-end}
.sheet.full{left:0;transform:none;top:0;bottom:0;width:100%;max-height:none;height:100dvh;border-radius:0;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px));animation:none}
.sheet.full>*:not(.bar-b):not(.modal):not(.photos){margin-left:max(16px,calc((100% - 960px)/2));margin-right:max(16px,calc((100% - 960px)/2))}
.sheet.full .photos{padding-left:max(16px,calc((100% - 960px)/2));padding-right:16px;margin:0;scroll-padding-left:max(16px,calc((100% - 960px)/2))}
.bar-b{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:10px max(16px,calc((100% - 960px)/2));padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.bar-b .bt{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;font-size:22px;cursor:pointer;padding:4px 8px 4px 0;color:var(--fg)}
.btn.pill{border-radius:999px;padding:9px 18px;white-space:nowrap}
.hero{display:flex;align-items:center;gap:16px;padding:28px 0 18px}
.hero .av{width:84px;height:84px;border-radius:50%}
.hero h2{margin:0;font-size:clamp(24px,4vw,32px);font-weight:700;letter-spacing:-.01em}
.hero .sub{color:var(--muted);font-size:13px;margin-top:4px}
.sheet.full .board{columns:3 240px}
.tile{background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tile .meta span{font-weight:700;color:var(--fg)}
.tile.add{border:2px dashed var(--fg);background:transparent;color:var(--fg);box-shadow:none}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--surface);border-radius:18px;width:min(560px,100%);padding:20px;box-shadow:var(--shadow);max-height:calc(100dvh - 32px);overflow:auto}
.modal-card textarea{min-height:180px;font-size:16px;line-height:1.7}
.cb-tools{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-top:10px}
.mic{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--fg);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
.mic.on{background:var(--fg);color:var(--bg);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.fromrow{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--muted)}
.fromrow input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.btn.wide{width:100%;padding:13px;font-size:15px;margin-top:6px}
.lb{position:fixed;inset:0;z-index:40;background:rgba(10,8,6,.88);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:90dvh;border-radius:12px}
textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);resize:vertical}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--fg);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.note{font-size:12px;color:var(--muted)}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{background:var(--accent-soft);border-radius:12px;padding:8px 12px}
.msg p{margin:0;overflow-wrap:anywhere}
.msg .meta{font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center}
.msg .del{border:0;background:none;color:var(--accent);cursor:pointer;font-size:11px;padding:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-size:14px}
/* gate */
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.gate .load{text-align:center}.gate form{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px}
.gate h1{font-family:var(--round);margin:0;font-size:22px}
.gate input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.err{color:var(--accent);font-size:13px;min-height:1.2em}
/* ===== 原稿用紙・手紙トーン ===== */
:root{--bg:#fbfaf5;--surface:#fffefa;--fg:#262421;--muted:#7a756c;--line:#e4dfd3;--accent-soft:#f4f1e8;--grid:#ebe6da;--rule:#d9d3c4;
--mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;--hand:"Klee One","Hiragino Maru Gothic ProN",cursive}
@media (prefers-color-scheme:dark){:root{--bg:#1a1916;--surface:#22201c;--fg:#ece7dc;--muted:#a39d91;--line:#3a362f;--accent-soft:#2a2823;--grid:#2a2823;--rule:#3d3931}}
body{font-family:var(--mincho);background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:30px 30px;background-attachment:fixed}
header h1,.gate h1{font-family:var(--mincho);font-weight:800;letter-spacing:.08em}
header p{font-family:var(--mincho);line-height:2}
.big span{font-family:var(--mincho)}
.big b{font-family:var(--mincho);font-weight:800;letter-spacing:0}
.bar{background:transparent;backdrop-filter:blur(2px)}
.card .nm{font-family:var(--hand);font-size:14px}
.av{border-radius:50%}
.sheet.full{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:30px 30px}
.bar-b{background:var(--bg)}
.bar-b .bt,.hero h2{font-family:var(--mincho);font-weight:800;letter-spacing:.04em}
.tabs button{font-family:var(--mincho)}
/* みんなのメッセージ＝罫線ノートに手書き */
.tile{font-family:var(--hand);background-color:var(--surface);background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-position:0 12px;border:1px solid var(--line);border-radius:4px;box-shadow:0 2px 8px rgba(60,50,30,.08);padding:12px 18px 14px}
.tile p{font-size:16px;line-height:32px;margin:0 0 4px}
.tile .meta{font-family:var(--hand);justify-content:flex-end;line-height:32px}
.tile .meta span{font-weight:600}
.tile.add{font-family:var(--mincho);background-image:none;border:1.5px dashed var(--fg)}
/* 当時の投稿＝原稿用紙に明朝 */
.post{font-family:var(--mincho);background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;border:1px solid var(--rule);border-radius:2px;box-shadow:0 2px 8px rgba(60,50,30,.06)}
.post .cover{font-family:var(--mincho);font-weight:800;letter-spacing:.03em}
.post p{line-height:2.1;font-size:15px}
/* 書く欄＝便箋 */
.modal-card{background:var(--surface);border-radius:6px}
.cb-head b{font-family:var(--mincho);font-size:17px}
.modal-card textarea{font-family:var(--hand);font-size:17px;line-height:34px;padding:2px 14px;background-color:var(--surface);background-image:repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 34px);background-attachment:local;border:1px solid var(--line);border-radius:4px;min-height:210px}
.btn,.mic,.fromrow{font-family:var(--mincho)}
.photos figure img{border-radius:4px}
.photos figcaption{font-family:var(--hand);font-size:12px}
/* ===== 縦書きトーン ===== */
body{background-image:repeating-linear-gradient(90deg,transparent 0 39px,var(--grid) 39px 40px);background-size:auto}
.sheet.full{background-image:repeating-linear-gradient(90deg,transparent 0 39px,var(--grid) 39px 40px);background-size:auto}
.tate-hero{writing-mode:vertical-rl;display:flex;gap:26px;height:min(560px,78vh);margin:28px auto 8px;overflow-x:auto;max-width:100%;align-items:flex-start;padding:4px 0}
.tate-hero h1{font-family:var(--hand);font-weight:600;font-size:clamp(46px,9vw,72px);letter-spacing:.18em;margin:0;line-height:1.1;white-space:nowrap}
.tate-hero .sub-t{white-space:nowrap;font-family:var(--mincho);font-size:15px;letter-spacing:.3em;color:var(--muted);margin:0;padding-top:.6em}
.tate-hero .lead{font-family:var(--mincho);font-size:16px;line-height:2.1;letter-spacing:.1em;margin:0;padding-top:4.5em;color:var(--fg);white-space:nowrap}
header{display:flex;flex-direction:column;align-items:center}
.big{justify-content:center}
/* みんなのメッセージ＝縦書きの一筆箋 */
.sheet.full .board{columns:auto;display:flex;flex-wrap:wrap;flex-direction:row-reverse;justify-content:flex-start;gap:14px}
.tile{writing-mode:vertical-rl;width:auto;height:340px;max-width:100%;overflow-x:auto;margin:0;padding:18px 14px;background-image:repeating-linear-gradient(90deg,transparent 0 33px,var(--rule) 33px 34px);background-position:right 14px top 0}
.tile p{font-size:17px;line-height:34px;margin:0 0 0 6px;letter-spacing:.06em}
.tile .meta{justify-content:flex-end;line-height:34px;margin:0}
.tile.add{writing-mode:horizontal-tb;width:180px;height:340px;background-image:none}
/* 当時の投稿＝縦書きの原稿 */
.post{writing-mode:vertical-rl;max-height:min(560px,72vh);overflow-x:auto;padding:24px 18px;background-image:repeating-linear-gradient(90deg,transparent 0 35px,var(--grid) 35px 36px);background-size:auto;background-position:right 18px top 0}
.post .cover{font-size:clamp(20px,2.6vw,24px);margin:0 0 0 18px;line-height:1.6;letter-spacing:.08em}
.post p{line-height:36px;font-size:16px;letter-spacing:.08em;margin:0}
.post .meta{margin:0 18px 0 0;font-size:12px;letter-spacing:.05em}
#tab-posts{display:flex;flex-direction:column;gap:16px}
/* 書く欄も縦書き罫の便箋に（入力は横書きのまま） */
.cb-head b{writing-mode:horizontal-tb}
.wall{margin:8px calc(50% - 50vw) 8px;width:100vw;max-width:none}
.wall img{display:block;width:100%;max-height:78vh;object-fit:cover;filter:grayscale(.15) contrast(1.02)}
@media (min-width:1100px){.wall{margin:12px auto;width:100%}.wall img{border-radius:4px}}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="load"><h1>Radix 10周年 寄せ書き</h1><p class="note" id="gateErr">読み込んでいます…</p></div></div>

<div class="wrap" id="app" hidden>
  <header>
    <div class="tate-hero">
      <h1>寄せ書き</h1>
      <p class="sub-t">Radix 十周年</p>
      <p class="lead">一緒に走ってきた人へ、<br>あなたの言葉で。<br><br>顔を押すと、その人の<br>当時の写真や、<br>発表・決意の投稿が出てきます。<br><br>思い出に浸ってから<br>書いてみてください。<br>短くても大丈夫です。</p>
    </div>
    <figure class="wall"><img src="wall.jpg" alt="オフィスの壁に書かれたSAKIYOMIの文字と、みんなの言葉" loading="eager"></figure>
    <div class="big" aria-live="polite">
      <div><span>みんなから集まったメッセージ</span><b><span id="bigMsg" style="all:unset">0</span><small style="font-size:.22em;letter-spacing:0;margin-left:.15em;font-weight:500">件</small></b></div>
    </div>
  </header>
  <div class="bar">
    <div class="me"><label for="me">あなたの名前</label><input id="me" list="names" placeholder="例：岸原 誠" autocomplete="name"></div>
    <input id="q" type="search" placeholder="名前でさがす">
    <div class="seg" role="tablist" id="seg"><button data-r="all" class="on">すべて</button><button data-r="partner">元パートナー</button><button data-r="innovator">元イノベーター</button></div>
    <label class="chk"><input id="showCur" type="checkbox">現メンバーも表示</label>
    <span class="stat" id="stat"></span>
    <div class="prog" aria-hidden="true"><i id="progBar"></i></div>
  </div>
  <datalist id="names"></datalist>
  <div class="grid" id="grid"></div>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shName" hidden></section>
<div class="toast" id="toast" hidden></div>
<div class="lb" id="lb" hidden><img id="lbImg" alt="当時の写真"></div>

<script>
const API='https://script.google.com/macros/s/AKfycbwmzffnY-hwKJcy-DftwktmSfp2b22DRqWlML2y90UgYoNGGBSGqqqukoo53QsLBR-JQA/exec';
const KEY='radix10';
let ME='';try{ME=localStorage.getItem('yk_me')||''}catch(e){}
let MINE=[];try{MINE=JSON.parse(localStorage.getItem('yk_mine')||'[]')}catch(e){}
let PEOPLE=[],BYN={},MSG=[],AV={},PH={},open=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ini=n=>{const p=n.split(' ');return p.length>1?(p[0][0]+p[p.length-1][0]).toUpperCase():n.slice(0,2)};
const avHtml=(p)=>p&&AV[p.av]?`<img alt="" src="${AV[p.av]}">`:esc(ini(p?p.n:'?'));
function save(k,v){try{localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v))}catch(e){}}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
async function get(params){const u=API+'?'+new URLSearchParams({...params,key:KEY});const r=await fetch(u);return r.json()}
async function post(body){const r=await fetch(API,{method:'POST',body:JSON.stringify({...body,key:KEY})});return r.json()}

async function boot(){
  let d;try{d=await get({action:'data'})}catch(e){$('#gateErr').textContent='つながりませんでした。通信状況を確認して、もう一度お試しください。';$('#gate').hidden=false;return}
  if(!d.ok){$('#gateErr').textContent='読み込みに失敗しました。少し待ってから再読み込みしてください。';return}
  $('#gate').hidden=true;$('#app').hidden=false;
  PEOPLE=d.people;BYN=Object.fromEntries(PEOPLE.map(p=>[p.n,p]));MSG=d.messages||[];
  $('#names').innerHTML=PEOPLE.map(p=>`<option value="${esc(p.n)}">`).join('');
  $('#me').value=ME;render();loadAvatars();
  setInterval(refresh,45000);
}
async function refresh(){try{const d=await get({action:'messages'});if(d.ok){MSG=d.messages;render();if(open)renderMsgs(open)}}catch(e){}}
async function loadAvatars(){
  const keys=[...new Set(PEOPLE.map(p=>p.av).filter(Boolean))];
  const jobs=[];for(let i=0;i<keys.length;i+=40){const ids=keys.slice(i,i+40).map(k=>'av:'+k);
    jobs.push(get({action:'photos',ids:ids.join(',')}).then(d=>{if(d.ok){for(const k in d.photos)AV[k.slice(3)]=d.photos[k];render()}}).catch(()=>{}))}
  await Promise.all(jobs);prefetchPhotos()
}
async function prefetchPhotos(){
  const order=[...PEOPLE].filter(p=>!p.cur).sort((a,b)=>count(a.n)-count(b.n));
  const ids=[...new Set(order.flatMap(p=>(p.ph||[]).map(x=>x[0])))].filter(id=>!PH[id]);
  const chunks=[];for(let i=0;i<ids.length;i+=25)chunks.push(ids.slice(i,i+25));
  let k=0;const worker=async()=>{while(k<chunks.length){const c=chunks[k++].filter(id=>!PH[id]);if(!c.length)continue;try{const d=await get({action:'photos',ids:c.join(',')});if(d.ok){Object.assign(PH,d.photos);if(open)document.querySelectorAll('#sheet img[data-id]').forEach(i=>{if(!i.src&&PH[i.dataset.id])i.src=PH[i.dataset.id]})}}catch(e){}}};
  await Promise.all([worker(),worker(),worker()]);
}
function warm(n){const p=BYN[n];if(!p)return;const ids=(p.ph||[]).map(x=>x[0]).filter(id=>!PH[id]);if(ids.length&&!warm.busy?.[n]){(warm.busy=warm.busy||{})[n]=1;get({action:'photos',ids:ids.join(',')}).then(d=>{if(d.ok)Object.assign(PH,d.photos)}).catch(()=>{})}}
const count=n=>MSG.filter(m=>m.to===n).length;
const mineTo=n=>MSG.some(m=>m.to===n&&m.from===ME);
function render(){
  const q=$('#q').value.trim().toLowerCase(),showCur=$('#showCur').checked;
  const list=PEOPLE.filter(p=>(showCur||!p.cur)&&(ROLE==='all'||p.cur||p.role===ROLE)&&(!q||p.n.toLowerCase().includes(q)));
  list.sort((a,b)=>(count(a.n)-count(b.n))||(mineTo(a.n)-mineTo(b.n))||a.n.localeCompare(b.n));
  $('#grid').innerHTML=list.map(p=>{const c=count(p.n),m=ME&&mineTo(p.n);
    return `<button class="card${p.cur?' cur':''}" data-n="${esc(p.n)}"><span class="av">${avHtml(p)}</span><span class="nm">${esc(p.n)}</span><span class="cnt${m?' mine':c?'':' zero'}">${m?'書いた ・ ':''}${c}件</span></button>`}).join('');
  const targets=PEOPLE.filter(p=>!p.cur),done=targets.filter(p=>count(p.n)>0).length,mine=ME?MSG.filter(m=>m.from===ME).length:0;
  $('#bigMsg').textContent=MSG.length;
  $('#stat').textContent=ME?`あなた ${mine}件`:'';
  void `メッセージ ${MSG.length}件 ・ 届いた人 ${done}/${targets.length}人${ME?` ・ あなた ${mine}件`:''}`;
  $('#progBar').style.width=(targets.length?done/targets.length*100:0)+'%';
}
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openSheet(c.dataset.n)});
['pointerover','touchstart','focusin'].forEach(t=>$('#grid').addEventListener(t,e=>{const c=e.target.closest('.card');if(c)warm(c.dataset.n)},{passive:true}));
let ROLE='all';
$('#seg').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;ROLE=b.dataset.r;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));render()});
$('#q').addEventListener('input',render);$('#showCur').addEventListener('change',render);
$('#me').addEventListener('change',()=>{ME=$('#me').value.trim();save('yk_me',ME);render()});

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,recBase='';
function stopMic(){if(rec){try{rec.stop()}catch(e){}rec=null}const b=$('#mic');if(b){b.classList.remove('on');b.setAttribute('aria-pressed','false');b.querySelector('span').textContent='話して書く'}}
function toggleMic(){if(rec){stopMic();return}const t=$('#txt');rec=new SR();rec.lang='ja-JP';rec.continuous=true;rec.interimResults=true;recBase=t.value?t.value.replace(/\s*$/,'')+(t.value.trim()?'\n':''):'';
  rec.onresult=e=>{let fin='',tmp='';for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else tmp+=r[0].transcript}t.value=(recBase+fin+tmp).slice(0,600)};
  rec.onend=()=>{if(rec){recBase=t.value;try{rec.start()}catch(e){stopMic()}}};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){toast('マイクの使用が許可されていません');stopMic()}};
  try{rec.start()}catch(e){toast('音声入力を開始できませんでした');rec=null;return}const b=$('#mic');b.classList.add('on');b.setAttribute('aria-pressed','true');b.querySelector('span').textContent='聞き取り中…タップで停止'}
const LAYOUT_B=new Set(['Kota Nakanishi']);
const ym=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})/);return m?`${m[1]}年${+m[2]}月`:esc(s)};
function hints(p){
  const h=[];
  if(p.ph&&p.ph.length&&!p.group)h.push('写真の日、どんな空気でしたか？');if(p.group)h.push('この頃のSAKIYOMI、どんな雰囲気でしたか？');
  if(p.own&&p.own.length)h.push(`${p.n}さんのこの投稿を読んだとき、どう感じましたか？`);
  h.push('一緒にやったことで、今でも覚えている場面は？');
  h.push('言われてうれしかった言葉、助けられたことは？');
  h.push('当時は言えなかった「ありがとう」は？');
  h.push('今の'+p.n+'さんに伝えたいことは？');
  return h.slice(0,4);
}
function openSheet(n){
  const p=BYN[n];if(!p)return;open=n;
  const span=p.span?`${p.span[0].replace('-','年')}月〜${p.span[1].replace('-','年')}月`:'';
  const postHtml=(t,meta,pics)=>{const lines=t.split('\n');const G=/^(@\S*\s*)*(お疲れ様|おつかれ|お疲れさま|おはよう|こんにちは|こんばんは|全体メンション|夜分|休日に失礼|失礼いたします|失礼します|皆さん|みなさん|cc)/i;
    let i=lines.findIndex((l,k)=>k<6&&/^【.+】/.test(l.trim()));if(i<0){i=0;while(i<lines.length&&(!lines[i].trim()||G.test(lines[i].trim())||lines[i].trim().length<6||/^@\S+\s*$/.test(lines[i].trim())))i++;if(i>=lines.length)i=0}
    const full=(lines[i]||'').trim().replace(/^(@\S+\s*)+/,'');const mm=full.match(/^.+?[。！!？?]+(?=.)/);let cover=full,rest='';if(full.length>45&&mm&&mm[0].length>=6){cover=mm[0];rest=full.slice(mm[0].length).trim()}
    const body=lines.map((l,k)=>k===i?rest:l).filter((l,k)=>!(k===i&&!l)).join('\n').replace(/^\s+/,'');
    return `<article class="post"><h4 class="cover">${esc(cover)}</h4><p>${esc(body)}</p><div class="meta">${meta}</div></article>`};
  const posts=[...(p.own||[]).slice().sort((a,b)=>String(a[1]).localeCompare(String(b[1]))).map(o=>postHtml(o[0],`${esc(p.n)}さんの投稿 ・ ${ym(o[1])} ・ #${esc(o[4])} ・ スタンプ${o[2]}`)),...(p.about||[]).map(o=>postHtml(o[0],`${esc(o[3])}さんが${esc(p.n)}さんについて書いた投稿 ・ ${ym(o[1])} ・ スタンプ${o[2]}`))];
  const own=posts.join('');
  const rel=(p.r||[]).filter(x=>BYN[x]).map(x=>`<button data-go="${esc(x)}"><span class="av">${avHtml(BYN[x])}</span>${esc(x)}</button>`).join('');
  const ph=[...[...(p.own||[]),...(p.about||[])].flatMap(o=>(o[5]||[]).map(id=>[id,o[1]])),...(p.ph||[])].filter((x,i,a)=>a.findIndex(y=>y[0]===x[0])===i).slice(0,10).sort((a,b)=>String(a[1]).localeCompare(String(b[1])));
  const top=`<div class="sh-top"><span class="av">${avHtml(p)}</span><div><h2 id="shName">${esc(p.n)}</h2><div class="sub">${span?`Slackでの活動 ${esc(span)}`:''}</div></div><button class="x" id="close" aria-label="閉じる">×</button></div>`;
  const photosH=ph.length?`<h3>${p.group?`${esc(p.n)}さんがいた頃のSAKIYOMI`:'あの頃の写真'}<small>${ph.length>1?'横にスワイプ →':''}</small></h3><div class="photos" id="photos">${ph.map(x=>`<figure><img data-id="${esc(x[0])}" alt="当時の写真" ${PH[x[0]]?`src="${PH[x[0]]}"`:''}><figcaption>${ym(x[1])}</figcaption></figure>`).join('')}</div>`:'';
  const postsH=own?`<h3>当時の投稿</h3>${own}`:'';
  const composeH=`<div class="compose">
      <h3>${esc(p.n)}さんへのメッセージ</h3>
      <p class="hint-lead">何を書くか迷ったら、こんなことを思い出してみてください。</p>
      <ul class="hints">${hints(p).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
      <textarea id="txt" maxlength="600" placeholder="思い出したことを、そのまま言葉にしてください。"></textarea>
      <div class="row"><button class="btn" id="send">送る</button><button class="btn ghost" id="next">次の人へ</button><span class="note" id="who"></span></div>
    </div>`;
  const msgsH=`<h3>届いているメッセージ</h3><div class="msgs" id="msgs"></div>`;
  const layoutB=true;
  if(layoutB){
    const photosB=ph.length?`<div class="photos b" id="photos">${ph.map(x=>`<figure><img data-id="${esc(x[0])}" alt="当時の写真" ${PH[x[0]]?`src="${PH[x[0]]}"`:''}><figcaption>${ym(x[1])}</figcaption></figure>`).join('')}</div>`:'';
    const mic=SR?`<button class="mic" id="mic" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg><span>話して書く</span></button>`:'';
    const composeB=`<div class="modal" id="composeBox" hidden><div class="modal-card" role="dialog" aria-label="メッセージを書く">
      <div class="cb-head"><b>${esc(p.n)}さんへ</b><button class="x sm" data-closecompose aria-label="閉じる">×</button></div>
      <textarea id="txt" maxlength="600" placeholder="思い出したことを、そのまま言葉にしてください。"></textarea>
      <div class="cb-tools">${mic}<details class="hintd"><summary>何を書くか迷ったら</summary><ul class="hints">${hints(p).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details></div>
      <label class="fromrow"><span>あなたの名前</span><input id="meB" list="names" value="${esc(ME)}" placeholder="例：岸原 誠" autocomplete="name"></label>
      <div class="row"><button class="btn wide" id="send">寄せ書きに貼る</button></div>
    </div></div>`;
    $('#sheet').innerHTML=`<div class="bar-b"><button class="back" id="close" aria-label="一覧に戻る">←</button><div class="bt">${esc(p.n)}さんへの寄せ書き</div><button class="btn pill" data-opencompose>＋ 書く</button></div>
      <header class="hero"><span class="av">${avHtml(p)}</span><div><h2 id="shName">${esc(p.n)}</h2><div class="sub">${span?`Slackでの活動 ${esc(span)}`:''}</div></div></header>
      ${photosB}
      <div class="tabs" role="tablist"><button class="on" data-tab="board">寄せ書き <span id="bcount"></span></button>${own?'<button data-tab="posts">当時の投稿</button>':''}</div>
      <section id="tab-board"><div class="board" id="msgs"></div><div class="row end"><button class="btn ghost" id="next">次の人へ →</button></div></section>
      <section id="tab-posts" hidden>${own}</section>${composeB}`;
    $('#sheet').classList.add('full');
  }else{$('#sheet').classList.remove('full');$('#sheet').innerHTML=top+photosH+postsH+composeH+msgsH}
  $('#scrim').hidden=false;$('#sheet').hidden=false;$('#sheet').scrollTop=0;
  if($('#who'))$('#who').textContent=ME?`${ME} として送ります`:'上の「あなたの名前」を入れてください';
  const pic=ph.map(x=>x[0]);renderMsgs(n);loadPhotos([...new Set(pic)].filter(id=>!PH[id]));
}
async function loadPhotos(ids){if(!ids.length)return;try{const d=await get({action:'photos',ids:ids.join(',')});if(d.ok){Object.assign(PH,d.photos);document.querySelectorAll('#sheet img[data-id]').forEach(i=>{if(PH[i.dataset.id])i.src=PH[i.dataset.id]})}}catch(e){}}
function renderMsgs(n){const el=$('#msgs');if(!el)return;const ms=MSG.filter(m=>m.to===n);
  if(el.classList.contains('board')){const bc=$('#bcount');if(bc)bc.textContent=ms.length?`${ms.length}`:'';
    el.innerHTML=(ms.length?'':`<button class="tile add" data-opencompose><span>＋</span>最初のメッセージを書く</button>`)+ms.map(m=>`<div class="tile"><p>${esc(m.text)}</p><div class="meta"><span>${esc(m.from)}</span>${MINE.includes(m.id)?`<button class="del" data-del="${esc(m.id)}">取り消す</button>`:''}</div></div>`).join('');return}
  el.innerHTML=ms.length?ms.map(m=>`<div class="msg"><p>${esc(m.text)}</p><div class="meta"><span>${esc(m.from)}</span>${MINE.includes(m.id)?`<button class="del" data-del="${esc(m.id)}">取り消す</button>`:''}</div></div>`).join(''):'<p class="note">まだありません。最初の一通をどうぞ。</p>'}
function closeSheet(){stopMic();open=null;$('#scrim').hidden=true;$('#sheet').hidden=true}
$('#scrim').addEventListener('click',closeSheet);
$('#lb').addEventListener('click',()=>$('#lb').hidden=true);
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#lb').hidden){$('#lb').hidden=true;return}if(open)closeSheet()});
$('#sheet').addEventListener('click',async e=>{
  if(e.target.closest('#close'))return closeSheet();
  const g=e.target.closest('[data-go]');if(g)return openSheet(g.dataset.go);
  const tb=e.target.closest('[data-tab]');if(tb){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b===tb));$('#tab-board').hidden=tb.dataset.tab!=='board';$('#tab-posts').hidden=tb.dataset.tab!=='posts';return}
  if(e.target.closest('[data-opencompose]')){$('#composeBox').hidden=false;setTimeout(()=>$('#txt').focus(),50);return}
  if(e.target.id==='composeBox'){stopMic();$('#composeBox').hidden=true;return}
  if(e.target.closest('#mic')){toggleMic();return}
  if(e.target.closest('[data-closecompose]')){stopMic();$('#composeBox').hidden=true;return}
  const mp=e.target.closest('[data-moreposts]');if(mp){$('#morePosts').hidden=false;mp.remove();return}
  const mo=e.target.closest('[data-more]');if(mo){const p=mo.closest('.post');p.classList.toggle('open');mo.textContent=p.classList.contains('open')?'閉じる':'全文を読む';return}
  const im=e.target.closest('#sheet img[data-id]');if(im&&im.src){$('#lbImg').src=im.src;$('#lb').hidden=false;return}
  const d=e.target.closest('[data-del]');if(d){const r=await post({action:'delete',id:d.dataset.del,from:ME});if(r.ok){MSG=MSG.filter(m=>m.id!==d.dataset.del);MINE=MINE.filter(x=>x!==d.dataset.del);save('yk_mine',MINE);renderMsgs(open);render();toast('取り消しました')}else toast('取り消せませんでした');return}
  if(e.target.closest('#next')){const nx=PEOPLE.filter(p=>!p.cur&&p.n!==open&&!mineTo(p.n)).sort((a,b)=>count(a.n)-count(b.n))[0];if(nx)openSheet(nx.n);return}
  if(e.target.closest('#send')){
    const text=$('#txt').value.trim();if($('#meB')&&$('#meB').value.trim())$('#me').value=$('#meB').value.trim();ME=$('#me').value.trim();
    if(!ME){toast('「あなたの名前」を入れてください');if($('#meB')){$('#meB').focus()}else{closeSheet();$('#me').focus()}return}
    if(!text){toast('メッセージを入れてください');return}
    const b=$('#send');b.disabled=true;b.textContent='送信中…';
    try{const r=await post({action:'post',to:open,from:ME,text});
      if(r.ok){MSG.push({ts:new Date().toISOString(),id:r.id,to:open,from:ME,text});MINE.push(r.id);save('yk_mine',MINE);save('yk_me',ME);$('#txt').value='';if($('#composeBox')){stopMic();$('#composeBox').hidden=true}renderMsgs(open);render();toast('送りました。ありがとう！')}
      else toast('送れませんでした（'+r.error+'）')}catch(err){toast('送れませんでした。通信状況を確認してください')}
    b.disabled=false;b.textContent='送る'}
});
boot();
</script>
</body>
</html>
