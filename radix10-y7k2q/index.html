      .replace(/(^|[^\w*])\*([^*\n]+?)\*(?=[^\w*]|$)/gm,'$1<b>$2</b>').replace(/(^|[\s>])_([^_\n]+)_/g,'$1<i>$2</i>').replace(/(^|[\s>])~([^~\n]+)~/g,'$1<s>$2</s>').replace(/:([a-z0-9_+\-]+):/g,(m,n)=>(S.EM||{})[n]?((S.EM[n].startsWith('http'))?`<img class="se" src="${esc(S.EM[n])}" alt="">`:S.EM[n]):m);
    const re=(S.re||[]).map(([n,c,v])=>`<span class="sr">${v&&v.startsWith('http')?`<img src="${esc(v)}" alt=":${esc(n)}:" loading="lazy">`:`<em>${v||'🙂'}</em>`}<b>${c}</b></span>`).join('');
    return `<article class="slk2"><div class="s-top"><i></i><i></i><i></i><span>株式会社SAKIYOMI</span></div><div class="s-ch"><svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><path fill="#1d1c1d" d="M7.5 2.5 6.3 7H3v1.5h2.9l-.8 3H2V13h2.7l-1.2 4.5H5L6.2 13h3.6l-1.2 4.5h1.5l1.2-4.5H15v-1.5h-3.3l.8-3H16V7h-3.1l1.2-4.5h-1.5L11.4 7H7.8L9 2.5zM7.4 8.5H11l-.8 3H6.6z"/></svg>${esc(o[4])}</div><div class="s-day"><span>${dd(+S.ts)}</span></div><div class="s-msg"><span class="s-av">${avHtml(p)}</span><div class="s-body"><div class="s-hd"><b>${esc(p.n)}</b><span>${tm(+S.ts)}</span></div><div class="s-tx">${t}</div>${(o[5]||[]).length?`<div class="s-imgs">${o[5].slice(0,4).map(id=>`<img data-id="${esc(id)}" alt="" ${PH[id]?`src="${PH[id]}"`:''}>`).join('')}</div>`:''}<div class="s-res">${re}<span class="sr s-add">☺︎+</span></div>${S.rc?`<div class="s-th">${(S.rav||[]).map(a=>`<img src="${esc(a)}" alt="" loading="lazy">`).join('')}<a>${S.rc}件の返信</a>${S.last?`<span>最終返信：${dl(+S.last)}</span>`:''}</div>`:''}</div></div><button class="s-more" type="button">続きを読む</button></article>`};
  const posts=[...(p.own||[]).slice().sort((a,b)=>String(a[1]).localeCompare(String(b[1]))).map(o=>o[7]?slkHtml(o):postHtml(o[0],`${esc(p.n)}さんの投稿 ・ ${ym(o[1])} ・ #${esc(o[4])}`))];
  const own=posts.join('');
  const rel=(p.r||[]).filter(x=>BYN[x]).map(x=>`<button data-go="${esc(x)}"><span class="av">${avHtml(BYN[x])}</span>${esc(x)}</button>`).join('');
  const ph=[...[...(p.own||[]),...(p.about||[])].flatMap(o=>(o[5]||[]).map(id=>[id,o[1]])),...(p.ph||[])].filter((x,i,a)=>a.findIndex(y=>y[0]===x[0])===i).slice(0,10).sort((a,b)=>((b[2]||0)-(a[2]||0))||String(a[1]).localeCompare(String(b[1])));
  const top=`<div class="sh-top"><span class="av">${avHtml(p)}</span><div><h2 id="shName">${esc(p.n)}</h2><div class="sub">${span?`Slackでの活動 ${esc(span)}`:''}</div></div><button class="x" id="close" aria-label="閉じる">×</button></div>`;
  const photosH=ph.length?`<h3>${p.group?`${esc(p.n)}さんがいた頃のSAKIYOMI`:'あの頃の写真'}<small>${ph.length>1?'横にスワイプ →':''}</small></h3><div class="photos" id="photos">${ph.map(x=>`<figure><img data-id="${esc(x[0])}" alt="当時の写真" ${PH[x[0]]?`src="${PH[x[0]]}"`:''}><figcaption>${ym(x[1])}</figcaption></figure>`).join('')}</div>`:'';
  const postsH=own?`<h3>当時の投稿</h3>${own}`:'';
  const composeH=`<div class="compose">
      <h3>${esc(p.n)}さんへのメッセージ</h3>
      <p class="hint-lead">何を書くか迷ったら、こんなことを思い出してみてください。</p>
      <ul class="hints">${hints(p).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
      <textarea id="txt" maxlength="600" placeholder="今の${esc(p.n)}さんに話したいこと、聞いてほしいことを、そのまま言葉にしてください。"></textarea>
      <div class="row"><button class="btn" id="send">送る</button><button class="btn ghost" id="next">次の人へ</button><span class="note" id="who"></span></div>
    </div>`;
  const msgsH=`<h3>届いているメッセージ</h3><div class="msgs" id="msgs"></div>`;
  const layoutB=true;
  if(layoutB){
    const photosB=ph.length?`<h3 class="sec-h">📷 ${p.group?`${esc(p.n)}さんがいた頃のSAKIYOMI`:'懐かしい写真'}<small>${ph.length}枚</small>${ph.length>1?'<span class="sw">横にスワイプ →</span>':''}</h3><div class="photos b" id="photos">${ph.map(x=>`<figure><img data-id="${esc(x[0])}" alt="当時の写真" ${PH[x[0]]?`src="${PH[x[0]]}"`:''}><figcaption>${ym(x[1])}</figcaption></figure>`).join('')}</div>`:'';
    const mic=SR?`<button class="mic" id="mic" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg><span>話して書く</span></button>`:'';
    const composeB=`<div class="sk-dockc" id="composeDock">
      <div class="sk-comp"><div class="sk-tb"><span><b>B</b></span><span><i>I</i></span><span><s>S</s></span><span>🔗</span><span>☰</span><span>❝</span></div>
      <textarea id="txt" maxlength="600" rows="2" placeholder="今あなたが伝えたいこと、話したいこと、自慢したいこと…"></textarea>
      <div class="sk-cbt"><span class="ic">＋</span><span class="ic">Aa</span><span class="ic">☺</span><span class="ic">@</span>${mic}<span class="sp"></span><button class="btn" id="send">送信 ➤</button></div></div>
      <div class="sk-from"><label>送信者：<input id="meB" list="names" value="${esc(ME)}" placeholder="名簿から選ぶ（例 Makoto Kishihara）" autocomplete="off"></label><details class="hintd"><summary>何を書くか迷ったら</summary><ul class="hints">${hints(p).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details></div>
    </div>`;
    const isInv=INV===p.n,nMsg=count(p.n);
    const boardB=`<h3 class="sec-h">✉️ ${isInv?'あなたへのメッセージ':'寄せ書き'} <small><span id="bcount"></span>件</small></h3>
      <section id="tab-board"><div class="board" id="msgs"></div><div class="row end"><button class="btn ghost" id="close2">← みんなの一覧に戻る</button><button class="btn ghost" id="next">次の人へ →</button></div></section>`;
    $('#sheet').innerHTML=`<div class="bar-b"><button class="back" id="close" aria-label="一覧に戻る">← 一覧へ</button><div class="bt">${esc(p.n)}${isInv?' さんへの招待状':''}</div><button class="btn pill" data-opencompose>＋ 書く</button></div>
      <header class="hero"><div class="heroWords" id="heroWords" aria-hidden="true"></div><span class="av">${avHtml(p)}${ATT.has(p.n)?MARU:''}</span><h2 id="shName">${esc(p.n)}</h2><div class="sub">${span?`Slackでの活動 ${esc(span)}`:''}</div>${isInv?`<p class="inv-lead">12月19日、SAKIYOMI 10周年の総会へ。<br>あなたに <b id="invN">${nMsg}</b> 件のメッセージが届いています。</p>`:''}</header>
      ${isInv?boardB:''}
      ${photosB}
      ${own?`<h3 class="sec-h">💬 懐かしい投稿<small>${(p.own||[]).length}件</small>${(p.own||[]).length>1?'<span class="sw">横にスワイプ →</span>':''}</h3><div class="poststrip">${own}</div>`:''}
      ${isInv?'':boardB}<div class="sk-dock">${p.cur&&!isInv?'':ctaHtml(p.n)}${isInv?'':composeB}</div>`;
    $('#sheet').classList.add('full');
    if(window._hw)window._hw.stop();setTimeout(()=>{const f=$('#heroWords');if(f)window._hw=placeTyper(f,{n:46,keep:true,vert:.35,maxLen:16,cls:'sm',gap:3,tries:80,step:45,size:()=>11+Math.random()*12|0,op:()=>.28+Math.random()*.4,avoid:[...document.querySelectorAll('.hero .av,.hero h2,.hero .sub,.hero .writebig,.hero .inv-lead')]})},150);
  }else{$('#sheet').classList.remove('full');$('#sheet').innerHTML=top+photosH+postsH+composeH+msgsH}
  $('#scrim').hidden=false;$('#sheet').hidden=false;$('#sheet').scrollTop=0;
  if($('#who'))$('#who').textContent=ME?`${ME} として送ります`:'上の「あなたの名前」を入れてください';
  const pic=[...ph.map(x=>x[0]),...(p.own||[]).flatMap(o=>(o[5]||[]).slice(0,4))];renderMsgs(n);loadPhotos([...new Set(pic)].filter(id=>!PH[id]));
}
async function loadPhotos(ids){if(!ids.length)return;const sp=[];for(let i=0;i<ids.length;i+=2)sp.push(ids.slice(i,i+2));await Promise.all(sp.map(c=>get({action:'photos',ids:c.join(',')}).then(d=>{if(d.ok)gotPhotos(d.photos)}).catch(()=>{})))}
function renderMsgs(n){const el=$('#msgs');if(!el)return;const all=MSG.filter(m=>m.to===n);const ms=INV===n?all:all.filter(m=>MINE.includes(m.id)||(ME&&m.from===ME));const lk=all.length-ms.length;if(INV===n&&$('#invN'))$('#invN').textContent=all.length;
  if(el.classList.contains('board')){const bc=$('#bcount');if(bc)bc.textContent=all.length;
    el.innerHTML=(all.length||INV===n?'':`<button class="tile add" data-opencompose><span>＋</span>最初のメッセージを書く</button>`)+(INV===n&&!all.length?'<p class="note">メッセージはこれから届きます。</p>':'')+(lk?`<div class="tile lock"><span class="t-av">🔒</span><div class="t-b"><p>本人だけが招待状で読めます</p><div class="meta"><span>ほか ${lk} 件</span></div></div></div>`:'')+ms.map(m=>{const fp=BYN[m.from];const d=m.ts?new Date(m.ts):null;const tm=d&&!isNaN(d)?d.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';return `<div class="tile"><span class="t-av">${fp?avHtml(fp):esc(String(m.from||'?').trim().slice(0,1))}</span><div class="t-b"><p>${esc(m.text)}</p><div class="meta"><span>${esc(m.from)}</span><span class="tm">${esc(tm)}</span>${MINE.includes(m.id)?`<button class="del" data-del="${esc(m.id)}">取り消す</button>`:''}</div></div></div>`}).join('');return}
  el.innerHTML=ms.length?ms.map(m=>`<div class="msg"><p>${esc(m.text)}</p><div class="meta"><span>${esc(m.from)}</span>${MINE.includes(m.id)?`<button class="del" data-del="${esc(m.id)}">取り消す</button>`:''}</div></div>`).join(''):'<p class="note">まだありません。最初の一通をどうぞ。</p>'}
function closeSheet(){if(INV)return;stopMic();if(window._hw){window._hw.stop();window._hw=null}open=null;$('#scrim').hidden=true;$('#sheet').hidden=true}
$('#scrim').addEventListener('click',closeSheet);
$('#lb').addEventListener('click',e=>{if(e.target.closest('.slk')&&!e.target.closest('.slk-close'))return;$('#lb').hidden=true});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#lb').hidden){$('#lb').hidden=true;return}if(open)closeSheet()});
$('#sheet').addEventListener('click',async e=>{
  if(e.target.closest('#close')||e.target.closest('#close2'))return closeSheet();
  if(e.target.closest('.s-more')){e.target.closest('.slk2').classList.add('open');return}
  const g=e.target.closest('[data-go]');if(g)return openSheet(g.dataset.go);
  const tb=e.target.closest('[data-tab]');if(tb){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b===tb));$('#tab-board').hidden=tb.dataset.tab!=='board';$('#tab-posts').hidden=tb.dataset.tab!=='posts';return}
  if(e.target.closest('#rsvp')||e.target.closest('#rsvpX')){const n=open,on=!!e.target.closest('#rsvp');if(on)ATT.add(n);else ATT.delete(n);$('#ctaB').outerHTML=ctaHtml(n);const av=document.querySelector('.hero .av');if(av){av.querySelector('.maru')?.remove();if(on)av.insertAdjacentHTML('beforeend',MARU)}render();
    try{const r=await post({action:'post',to:'__rsvp__',from:n,text:on?'出席':'取消'});if(!r.ok)throw 0}catch(err){if(on)ATT.delete(n);else ATT.add(n);$('#ctaB').outerHTML=ctaHtml(n);render();alert('送れませんでした。もう一度押してください')}return}
  if(e.target.closest('[data-opencompose]')){const t=$('#txt');if(t){t.focus();t.scrollIntoView({block:'center'})}return}
    if(e.target.closest('#mic')){toggleMic();return}
    const mp=e.target.closest('[data-moreposts]');if(mp){$('#morePosts').hidden=false;mp.remove();return}
  const mo=e.target.closest('[data-more]');if(mo){const p=mo.closest('.post');p.classList.toggle('open');mo.textContent=p.classList.contains('open')?'閉じる':'全文を読む';return}
  const im=e.target.closest('#sheet img[data-id]');if(im&&im.src){$('#lbImg').src=im.src;const p=BYN[open];const x=p&&(p.ph||[]).find(y=>y[0]===im.dataset.id);const c=x&&x[3];const box=$('#lbPost');
    if(c){box.innerHTML=`<div class="slk-ch"># ${esc(c.ch)}</div><div class="slk-msg"><span class="slk-av">${avHtml(p)}</span><div class="slk-body"><div class="slk-head"><b>${esc(p.n)}</b><span>${esc(c.at)}</span></div><p>${esc(c.t)}</p><img src="${im.src}" alt="" class="slk-img"></div></div>`;box.hidden=false;$('#lbImg').hidden=true}
    else{box.hidden=true;$('#lbImg').hidden=false}
    $('#lb').hidden=false;return}
  const d=e.target.closest('[data-del]');if(d){const r=await post({action:'delete',id:d.dataset.del,from:ME});if(r.ok){MSG=MSG.filter(m=>m.id!==d.dataset.del);MINE=MINE.filter(x=>x!==d.dataset.del);save('yk_mine',MINE);renderMsgs(open);render();toast('取り消しました')}else toast('取り消せませんでした');return}
  if(e.target.closest('#next')){const nx=PEOPLE.filter(p=>!p.cur&&p.n!==open&&!mineTo(p.n)).sort((a,b)=>count(a.n)-count(b.n))[0];if(nx)openSheet(nx.n);return}
  if(e.target.closest('#send')){
    const text=$('#txt').value.trim();if($('#meB')&&$('#meB').value.trim())$('#me').value=$('#meB').value.trim();ME=$('#me').value.trim();
    if(!ME){toast('「あなたの名前」を入れてください');if($('#meB')){$('#meB').focus()}else{closeSheet();$('#me').focus()}return}
    if(!text){toast('メッセージを入れてください');return}
    const b=$('#send');b.disabled=true;b.textContent='送信中…';
    try{const r=await post({action:'post',to:open,from:ME,text});
      if(r.ok){MSG.push({ts:new Date().toISOString(),id:r.id,to:open,from:ME,text});MINE.push(r.id);save('yk_mine',MINE);save('yk_me',ME);$('#txt').value='';if($('#composeBox')){stopMic();$('#composeBox').hidden=true}renderMsgs(open);render();toast('送りました。ありがとう！')}
      else toast('送れませんでした（'+r.error+'）')}catch(err){toast('送れませんでした。通信状況を確認してください')}
    b.disabled=false;b.textContent='送信 ➤'}
});
(function(){let seen=null;try{seen=localStorage.getItem('yk_intro')}catch(e){}
  if(seen){$('#gate').hidden=true;boot();return}
  try{localStorage.setItem('yk_intro','1')}catch(e){}
  const g=$('#gateErr');if(g)g.textContent='';
  setTimeout(()=>{const gt=$('#gate');gt.style.transition='opacity .6s';gt.style.opacity='0';setTimeout(boot,600)},3200)})();
</script>
</body>
