<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>顔写真の確認</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap">
<style>
:root{--bg:#f6f5f1;--fg:#141210;--muted:#5d574d;--ng:#d2392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1916;--fg:#ece7dc;--muted:#a39d91}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Klee One",sans-serif;font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:24px;margin:0 0 6px}p.lead{color:var(--muted);margin:0 0 20px;line-height:1.7}
.row{display:flex;gap:10px;align-items:flex-start;padding:14px 0;border-top:1px solid rgba(0,0,0,.1);flex-wrap:wrap}
.who{width:150px;flex:none;display:flex;flex-direction:column;gap:6px}
.who img{width:96px;height:96px;object-fit:cover;border-radius:6px;outline:3px solid #e8a33d}
.ph{position:relative;width:150px;height:150px;border-radius:6px;overflow:hidden;cursor:pointer;background:#ddd}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.ng img{opacity:.25}.ph.ng::after{content:"✕ 違う";position:absolute;inset:0;display:grid;place-items:center;color:var(--ng);font-size:22px}
.ph .d{position:absolute;left:4px;bottom:3px;font-size:11px;color:#fff;text-shadow:0 1px 2px #000}
.allng{font-size:12px;border:1px solid var(--muted);background:transparent;color:var(--fg);border-radius:999px;padding:4px 10px;cursor:pointer;font-family:inherit}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid rgba(0,0,0,.15);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:center}
.bar button{font-family:inherit;font-size:16px;border:0;border-radius:999px;padding:12px 28px;background:var(--fg);color:var(--bg);cursor:pointer}
#st{color:var(--muted)}
</style></head><body><div class="wrap">
<h1>顔写真の確認</h1>
<p class="lead">左のアイコンの人が<b>写っていない</b>写真をタップして「✕」にしてください（集合写真は、その人が写っていればOK）。<br>終わったら一番下の「送信」を押してください。</p>
<div id="list">読み込んでいます…</div></div>
<div class="bar"><span id="st"></span><button id="send">送信</button></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwmzffnY-hwKJcy-DftwktmSfp2b22DRqWlML2y90UgYoNGGBSGqqqukoo53QsLBR-JQA/exec',KEY='radix10';
const get=p=>fetch(API+'?'+new URLSearchParams({...p,key:KEY})).then(r=>r.json());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NG=new Set();
(async()=>{const [d,rv]=await Promise.all([get({action:'data'}),get({action:'photos',ids:'list:review'})]);
 const {R,dates}=JSON.parse(rv.photos['list:review']);const BY=Object.fromEntries(d.people.map(p=>[p.n,p]));
 const list=document.getElementById('list');
 list.innerHTML=R.map(r=>`<div class="row" data-n="${esc(r.n)}"><div class="who"><img data-av="${esc((BY[r.n]||{}).av||'')}" alt=""><div>${esc(r.n)}</div><button class="allng">全部ちがう</button></div>`+r.ids.map(id=>`<div class="ph" data-id="${id}"><img data-id="${id}" alt=""><span class="d">${esc((dates[id]||'').replace('-','年'))}${dates[id]?'月':''}</span></div>`).join('')+`</div>`).join('');
 list.addEventListener('click',e=>{const a=e.target.closest('.allng');if(a){const row=a.closest('.row');const phs=[...row.querySelectorAll('.ph')];const on=!phs.every(p=>p.classList.contains('ng'));phs.forEach(p=>{p.classList.toggle('ng',on);on?NG.add(row.dataset.n+'|'+p.dataset.id):NG.delete(row.dataset.n+'|'+p.dataset.id)});return}
  const p=e.target.closest('.ph');if(!p)return;const k=p.closest('.row').dataset.n+'|'+p.dataset.id;p.classList.toggle('ng');p.classList.contains('ng')?NG.add(k):NG.delete(k)});
 const avs=[...new Set([...list.querySelectorAll('img[data-av]')].map(i=>i.dataset.av).filter(Boolean))];
 for(let i=0;i<avs.length;i+=40){get({action:'photos',ids:avs.slice(i,i+40).map(a=>'av:'+a).join(',')}).then(x=>{list.querySelectorAll('img[data-av]').forEach(im=>{const u=x.photos['av:'+im.dataset.av];if(u)im.src=u})})}
 const ids=[...new Set(R.flatMap(r=>r.ids))];for(let i=0;i<ids.length;i+=12){get({action:'photos',ids:ids.slice(i,i+12).join(',')}).then(x=>{for(const k in x.photos)list.querySelectorAll(`img[data-id="${k}"]`).forEach(im=>im.src=x.photos[k])})}
})();
document.getElementById('send').onclick=async()=>{const st=document.getElementById('st');st.textContent='送信中…';
 const items=[...NG];const chunks=[];let cur='';for(const it of items){if((cur+';'+it).length>380){chunks.push(cur);cur=it}else cur=cur?cur+';'+it:it}chunks.push(cur||'none');
 for(const c of chunks){await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'post',key:KEY,to:'__review__',from:'kakunin',text:c})})}
 st.textContent='送信しました（✕ '+items.length+'枚）。ありがとうございます！'};
</script></body></html>
