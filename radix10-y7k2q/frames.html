<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>アイコン額縁 3案</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap">
<style>
:root{--bg:#fbfaf5;--fg:#141210;--muted:#4f4a42;--line:#e4dfd3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:repeating-linear-gradient(transparent 0 39px,#ebe6da 39px 40px);color:var(--fg);font-family:"Klee One",cursive;font-weight:600}
.wrap{max-width:980px;margin:0 auto;padding:32px 16px 80px}
h1{font-size:28px;margin:0 0 6px;letter-spacing:.08em}
.lead{color:var(--muted);margin:0 0 28px}
section{margin:0 0 44px}
h2{font-size:20px;margin:0 0 4px}
h2 small{font-size:14px;color:var(--muted);margin-left:8px}
.row{display:flex;flex-wrap:wrap;gap:22px 18px;margin-top:18px}
.cell{width:132px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.nm{font-size:13px}
img{display:block;width:100%;height:100%;object-fit:cover}
.ph{background:#ddd}

/* A 手描きの丸 */
.a{position:relative;width:108px;height:108px}
.a .ph{position:absolute;inset:9px;border-radius:50%;overflow:hidden}
.a svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.a path{fill:none;stroke:var(--fg);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* B 壁掛けの額 */
.b{position:relative;width:104px;padding-top:22px}
.b .hang{position:absolute;top:0;left:50%;width:56px;height:24px;transform:translateX(-50%)}
.b .hang path{fill:none;stroke:var(--fg);stroke-width:1.6;stroke-linecap:round}
.b .hang circle{fill:var(--fg)}
.b .frame{border:2.5px solid var(--fg);padding:7px;background:#fffefa;box-shadow:2px 3px 0 rgba(20,18,16,.12);border-radius:2px}
.b .ph{width:100%;aspect-ratio:1;outline:1px solid var(--fg);outline-offset:-1px}

/* C ポラロイド＋マステ */
.c{position:relative;width:110px;background:#fff;padding:8px 8px 26px;box-shadow:0 2px 8px rgba(40,30,20,.18);transform:rotate(var(--r,-3deg))}
.c .ph{width:100%;aspect-ratio:1}
.c .tape{position:absolute;top:-10px;left:50%;width:52px;height:18px;transform:translateX(-50%) rotate(-4deg);background:rgba(230,224,205,.85);border-left:1px dashed rgba(0,0,0,.08);border-right:1px dashed rgba(0,0,0,.08)}
.c .cap{position:absolute;left:0;right:0;bottom:4px;font-size:11px;text-align:center;color:var(--muted)}
.cell:nth-child(2n) .c{--r:2.5deg}.cell:nth-child(3n) .c{--r:-1deg}
</style>
</head>
<body>
<div class="wrap">
  <h1>アイコンの額縁 3案</h1>
  <p class="lead">一覧と各人のページのアイコンに使う額縁です。気に入ったものを教えてください。</p>

  <section><h2>A. 手描きの丸<small>ペンでぐるっと囲んだような線</small></h2><div class="row" id="rowA"></div></section>
  <section><h2>B. 壁掛けの額<small>細い黒枠と白いマット、上に紐と釘</small></h2><div class="row" id="rowB"></div></section>
  <section><h2>C. ポラロイド＋マスキングテープ<small>白フチ写真を少し傾けてテープで留める</small></h2><div class="row" id="rowC"></div></section>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbwmzffnY-hwKJcy-DftwktmSfp2b22DRqWlML2y90UgYoNGGBSGqqqukoo53QsLBR-JQA/exec',KEY='radix10';
const get=p=>fetch(API+'?'+new URLSearchParams({...p,key:KEY})).then(r=>r.json());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rough=(seed)=>{let d='';const cx=54,cy=54;for(let pass=0;pass<2;pass++){const pts=[];const start=seed*0.7+pass*0.4;for(let i=0;i<=26;i++){const a=start+i/24*Math.PI*2;const r=49+Math.sin(i*1.7+seed+pass)*1.6+(pass?1.2:0);pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}d+='M'+pts.map(p=>p.map(v=>v.toFixed(1)).join(' ')).join(' L')+' '}return d};
(async()=>{const d=await get({action:'data'});const ppl=d.people.filter(p=>!p.cur&&p.av).slice(0,6);
  const av=await get({action:'photos',ids:ppl.map(p=>'av:'+p.av).join(',')});const src=p=>av.photos['av:'+p.av]||'';
  rowA.innerHTML=ppl.map((p,i)=>`<div class="cell"><div class="a"><div class="ph"><img src="${src(p)}" alt=""></div><svg viewBox="0 0 108 108" aria-hidden="true"><path d="${rough(i+1)}"/></svg></div><div class="nm">${esc(p.n)}</div></div>`).join('');
  rowB.innerHTML=ppl.map(p=>`<div class="cell"><div class="b"><svg class="hang" viewBox="0 0 56 24" aria-hidden="true"><circle cx="28" cy="3" r="2.6"/><path d="M28 3 L6 23 M28 3 L50 23"/></svg><div class="frame"><div class="ph"><img src="${src(p)}" alt=""></div></div></div><div class="nm">${esc(p.n)}</div></div>`).join('');
  rowC.innerHTML=ppl.map(p=>`<div class="cell"><div class="c"><span class="tape"></span><div class="ph"><img src="${src(p)}" alt=""></div><div class="cap">${esc(p.n.split(' ')[0])}</div></div></div>`).join('');
})();
</script>
</body>
</html>
