<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>顔写真の確認</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap">
<style>
:root{--bg:#f6f5f1;--fg:#141210;--muted:#5d574d;--ng:#d2392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1916;--fg:#ece7dc;--muted:#a39d91}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Klee One",sans-serif;font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:24px;margin:0 0 6px}p.lead{color:var(--muted);margin:0 0 20px;line-height:1.7}
.row{display:flex;gap:10px;align-items:flex-start;padding:14px 0;border-top:1px solid rgba(0,0,0,.1);flex-wrap:wrap}
.who{width:150px;flex:none;display:flex;flex-direction:column;gap:6px}
.who img{width:96px;height:96px;object-fit:cover;border-radius:6px;outline:3px solid #e8a33d}
.ph{position:relative;width:150px;height:150px;border-radius:6px;overflow:hidden;cursor:pointer;background:#ddd}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.ng img{opacity:.25}.ph.ng::after{content:"✕ 違う";position:absolute;inset:0;display:grid;place-items:center;color:var(--ng);font-size:22px}
.ph .d{position:absolute;left:4px;bottom:3px;font-size:11px;color:#fff;text-shadow:0 1px 2px #000}
.allng{font-size:12px;border:1px solid var(--muted);background:transparent;color:var(--fg);border-radius:999px;padding:4px 10px;cursor:pointer;font-family:inherit}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid rgba(0,0,0,.15);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:center}
.bar button{font-family:inherit;font-size:16px;border:0;border-radius:999px;padding:12px 28px;background:var(--fg);color:var(--bg);cursor:pointer}
#st{color:var(--muted)}
.ph .ok,.ph .solo{position:absolute;top:4px;font-size:11px;color:#fff;padding:1px 6px;border-radius:999px}.ph .ok{left:4px;background:#2f7d4a}.ph .solo{right:4px;background:#c26a1b}
</style></head><body><div class="wrap">
<h1>顔写真の確認（2回目）</h1>
<p class="lead">左のアイコンの人が<b>写っていない</b>写真をタップして「✕」にしてください（集合写真は写っていればOK）。<br>「1人」の印はその人だけが写った写真です。最後に一番下の「送信」を押してください。</p>
<h2 style="font-size:18px;margin:28px 0 4px">1. 本人の写真チェック</h2>
<div id="list">読み込んでいます…</div>
<h2 style="font-size:18px;margin:36px 0 4px">2. この人だれ？（分かる人だけ）</h2>
<p class="lead">写真によく出てくるのに、まだ名前が分からない顔です。分かる人だけ選んでください。</p>
<div id="unk"></div>
<h2 style="font-size:18px;margin:36px 0 4px">3. 写真が見つからなかった人</h2>
<p class="lead" id="none"></p>
</div>
<div class="bar"><span id="st"></span><button id="send">送信</button></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwmzffnY-hwKJcy-DftwktmSfp2b22DRqWlML2y90UgYoNGGBSGqqqukoo53QsLBR-JQA/exec',KEY='radix10';
const get=p=>fetch(API+'?'+new URLSearchParams({...p,key:KEY})).then(r=>r.json());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NG=new Set();let UNK=0;
(async()=>{const [d,rv]=await Promise.all([get({action:'data'}),get({action:'photos',ids:'list:review2'})]);
 const {R,U,dates}=JSON.parse(rv.photos['list:review2']);const BY=Object.fromEntries(d.people.map(p=>[p.n,p]));
 const inv=d.people.filter(p=>!p.cur&&!p.hide).map(p=>p.n).sort();
 const list=document.getElementById('list');const ym=id=>dates[id]?dates[id].replace('-','年')+'月':'';
 const tile=(id,solo,ok)=>`<div class="ph" data-id="${id}"><img data-id="${id}" alt="">${ok?'<span class="ok">確認済み</span>':''}${solo?'<span class="solo">1人</span>':''}<span class="d">${esc(ym(id))}</span></div>`;
 list.innerHTML=Object.keys(R).sort().map(n=>{const [ap,nw]=R[n];return `<div class="row" data-n="${esc(n)}"><div class="who"><img data-av="${esc((BY[n]||{}).av||'')}" alt=""><div>${esc(n)}</div><button class="allng">全部ちがう</button></div>`+ap.map(id=>tile(id,false,true)).join('')+nw.map(x=>tile(x.replace('*',''),x.endsWith('*'),false)).join('')+`</div>`}).join('');
 list.addEventListener('click',e=>{const a=e.target.closest('.allng');if(a){const row=a.closest('.row');const phs=[...row.querySelectorAll('.ph')];const on=!phs.every(p=>p.classList.contains('ng'));phs.forEach(p=>{p.classList.toggle('ng',on);on?NG.add(row.dataset.n+'|'+p.dataset.id):NG.delete(row.dataset.n+'|'+p.dataset.id)});return}
  const p=e.target.closest('.ph');if(!p)return;const k=p.closest('.row').dataset.n+'|'+p.dataset.id;p.classList.toggle('ng');p.classList.contains('ng')?NG.add(k):NG.delete(k)});
 const opts='<option value="">― 分からない ―</option><option value="__cur">現メンバー</option>'+inv.map(n=>`<option>${esc(n)}</option>`).join('');
 UNK=U.length;document.getElementById('unk').innerHTML=U.map((c,i)=>`<div class="row"><div style="display:flex;gap:8px">`+[...Array(c).keys()].map(j=>`<div class="ph" style="width:120px;height:120px;cursor:default"><img data-id="uc:${i}_${j}" alt=""></div>`).join('')+`</div><select data-u="${i}" style="font-family:inherit;font-size:15px;padding:8px;border-radius:8px;align-self:center">${opts}</select></div>`).join('');
 const has=new Set(Object.keys(R));document.getElementById('none').textContent=inv.filter(n=>!has.has(n)).join('、');
 const avs=[...new Set([...list.querySelectorAll('img[data-av]')].map(i=>i.dataset.av).filter(Boolean))];
 for(let i=0;i<avs.length;i+=40){get({action:'photos',ids:avs.slice(i,i+40).map(a=>'av:'+a).join(',')}).then(x=>{list.querySelectorAll('img[data-av]').forEach(im=>{const u=x.photos['av:'+im.dataset.av];if(u)im.src=u})})}
 const ids=[...new Set([...document.querySelectorAll('img[data-id]')].map(i=>i.dataset.id))];
 for(let i=0;i<ids.length;i+=12){get({action:'photos',ids:ids.slice(i,i+12).join(',')}).then(x=>{for(const k in x.photos)document.querySelectorAll(`img[data-id="${k}"]`).forEach(im=>im.src=x.photos[k])})}
})();
document.getElementById('send').onclick=async()=>{const st=document.getElementById('st');st.textContent='送信中…';
 const items=[...NG].map(x=>'N|'+x).concat([...document.querySelectorAll('select[data-u]')].filter(s=>s.value).map(s=>'U|'+s.dataset.u+'|'+s.value));
 const chunks=[];let cur='';for(const it of items){if((cur+';'+it).length>380){chunks.push(cur);cur=it}else cur=cur?cur+';'+it:it}chunks.push(cur||'none');
 let bad=0;for(const c of chunks){let ok=false;for(let t=0;t<4&&!ok;t++){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'post',key:KEY,to:'__review__',from:'kakunin2',text:c})}).then(r=>r.json());ok=!!r.ok}catch(e){}if(!ok)await new Promise(r=>setTimeout(r,2500))}if(!ok)bad++}
 if(bad){st.textContent='一部送れませんでした。もう一度「送信」を押してください';return})}
 st.textContent='送信しました。ありがとうございます！'};
</script></body></html>
