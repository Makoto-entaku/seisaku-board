<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>写真えらび</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap">
<style>
:root{--bg:#f6f5f1;--fg:#141210;--muted:#5d574d;--ng:#d2392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1916;--fg:#ece7dc;--muted:#a39d91}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Klee One",sans-serif;font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:24px;margin:0 0 6px}p.lead{color:var(--muted);margin:0 0 20px;line-height:1.7}
.row{display:flex;gap:10px;align-items:flex-start;padding:14px 0;border-top:1px solid rgba(0,0,0,.1);flex-wrap:wrap}
.who{width:150px;flex:none;display:flex;flex-direction:column;gap:6px}
.who img{width:96px;height:96px;object-fit:cover;border-radius:6px;outline:3px solid #e8a33d}
.ph{position:relative;width:150px;height:150px;border-radius:6px;overflow:hidden;cursor:pointer;background:#ddd}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.ng img{opacity:.25}.ph.ng::after{content:"✕ 違う";position:absolute;inset:0;display:grid;place-items:center;color:var(--ng);font-size:22px}
.ph .d{position:absolute;left:4px;bottom:3px;font-size:11px;color:#fff;text-shadow:0 1px 2px #000}
.allng{font-size:12px;border:1px solid var(--muted);background:transparent;color:var(--fg);border-radius:999px;padding:4px 10px;cursor:pointer;font-family:inherit}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid rgba(0,0,0,.15);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:center}
.bar button{font-family:inherit;font-size:16px;border:0;border-radius:999px;padding:12px 28px;background:var(--fg);color:var(--bg);cursor:pointer}
#st{color:var(--muted)}
.ph .ok,.ph .solo{position:absolute;top:4px;font-size:11px;color:#fff;padding:1px 6px;border-radius:999px}.ph .ok{left:4px;background:#2f7d4a}.ph .solo{right:4px;background:#c26a1b}
.ph .star{position:absolute;right:4px;bottom:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:16px;cursor:pointer}
.ph.first{outline:4px solid #e8a33d}.ph.first .star{background:#e8a33d}
.ph .no{position:absolute;left:4px;top:4px;font-size:11px;color:#fff;background:rgba(0,0,0,.5);padding:1px 6px;border-radius:999px}
.ph.ng .star{display:none}
.nav{position:sticky;top:0;background:var(--bg);z-index:3;padding:8px 0;display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
.nav a{color:var(--fg)}
</style></head><body><div class="wrap">
<h1>写真えらび</h1>
<p class="lead">各個人ページに出る写真です（左から表示順）。<br>
・いらない写真はタップして「✕」に<br>・1枚目（いちばん左）にしたい写真は ★ を押す<br>
最後に一番下の「送信」を押してください。途中で送っても大丈夫です（何回でも送れます）。</p>
<div class="nav" id="nav"></div>
<div id="list">読み込んでいます…</div></div>
<div class="bar"><span id="st"></span><button id="send">送信</button></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwmzffnY-hwKJcy-DftwktmSfp2b22DRqWlML2y90UgYoNGGBSGqqqukoo53QsLBR-JQA/exec',KEY='radix10';
const get=p=>fetch(API+'?'+new URLSearchParams({...p,key:KEY})).then(r=>r.json());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NG=new Set(),FIRST={};
const order=ph=>[...ph].sort((a,b)=>(b[2]-a[2])||String(a[1]).localeCompare(String(b[1])));
(async()=>{const d=await get({action:'data'});
 const P=d.people.filter(p=>!p.cur&&!p.hide).sort((a,b)=>a.n.localeCompare(b.n));
 const list=document.getElementById('list');
 document.getElementById('nav').innerHTML=[...new Set(P.map(p=>p.n[0]))].map(c=>`<a href="#c-${c}">${c}</a>`).join(' ');
 const ym=s=>s?String(s).replace('-','年')+'月':'';
 list.innerHTML=P.map(p=>{const ph=order(p.ph||[]);return `<div class="row" data-n="${esc(p.n)}" id="c-${esc(p.n[0])}"><div class="who"><img data-av="${esc(p.av||'')}" alt=""><div>${esc(p.n)}</div><div style="font-size:12px;color:var(--muted)">${p.role==='partner'?'元パートナー':'元イノベーター'}・${ph.length}枚</div>${ph.length?'<button class="allng">全部いらない</button>':''}</div>`+(ph.length?ph.map((x,i)=>`<div class="ph${i===0?' first':''}" data-id="${esc(x[0])}"><img data-id="${esc(x[0])}" alt="" loading="lazy"><span class="no">${i+1}</span><span class="d">${esc(ym(x[1]))}</span><button class="star" title="1枚目にする">★</button></div>`).join(''):'<div style="align-self:center;color:var(--muted)">写真なし</div>')+`</div>`}).join('');
 list.addEventListener('click',e=>{const row=e.target.closest('.row');if(!row)return;const n=row.dataset.n;
  const a=e.target.closest('.allng');if(a){const phs=[...row.querySelectorAll('.ph')];const on=!phs.every(p=>p.classList.contains('ng'));phs.forEach(p=>{p.classList.toggle('ng',on);on?NG.add(n+'|'+p.dataset.id):NG.delete(n+'|'+p.dataset.id)});return}
  const s=e.target.closest('.star');if(s){const p=s.closest('.ph');row.querySelectorAll('.ph').forEach(x=>x.classList.remove('first'));p.classList.add('first');FIRST[n]=p.dataset.id;row.querySelector('.who').after(p);return}
  const p=e.target.closest('.ph');if(!p)return;const k=n+'|'+p.dataset.id;p.classList.toggle('ng');p.classList.contains('ng')?NG.add(k):NG.delete(k)});
 const avs=[...new Set(P.map(p=>p.av).filter(Boolean))];
 for(let i=0;i<avs.length;i+=40){get({action:'photos',ids:avs.slice(i,i+40).map(a=>'av:'+a).join(',')}).then(x=>{list.querySelectorAll('img[data-av]').forEach(im=>{const u=x.photos['av:'+im.dataset.av];if(u)im.src=u})})}
 // lazy-load photos per row as it scrolls into view
 const io=new IntersectionObserver(es=>{es.forEach(en=>{if(!en.isIntersecting)return;io.unobserve(en.target);const ids=[...en.target.querySelectorAll('img[data-id]')].map(i=>i.dataset.id);
   for(let i=0;i<ids.length;i+=10)get({action:'photos',ids:ids.slice(i,i+10).join(',')}).then(x=>{for(const k in x.photos)en.target.querySelectorAll(`img[data-id="${CSS.escape(k)}"]`).forEach(im=>im.src=x.photos[k])})})},{rootMargin:'600px'});
 list.querySelectorAll('.row').forEach(r=>io.observe(r));
})();
document.getElementById('send').onclick=async()=>{const st=document.getElementById('st');st.textContent='送信中…';
 const items=[...NG].map(x=>'X|'+x).concat(Object.entries(FIRST).map(([n,id])=>'F|'+n+'|'+id));
 const chunks=[];let cur='';for(const it of items){if((cur+';'+it).length>380){chunks.push(cur);cur=it}else cur=cur?cur+';'+it:it}chunks.push(cur||'none');
 let bad=0;for(const c of chunks){let ok=false;for(let t=0;t<4&&!ok;t++){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'post',key:KEY,to:'__review__',from:'erabi',text:c})}).then(r=>r.json());ok=!!r.ok}catch(e){}if(!ok)await new Promise(r=>setTimeout(r,2500))}if(!ok)bad++}
 if(bad){st.textContent='一部送れませんでした。もう一度「送信」を押してください';return}
 st.textContent='送信しました（✕ '+NG.size+'枚・★ '+Object.keys(FIRST).length+'人）'};
</script></body></html>
