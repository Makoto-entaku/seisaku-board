<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>この人だれ？</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap">
<style>
:root{--bg:#f6f5f1;--fg:#141210;--muted:#5d574d;--ng:#d2392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1916;--fg:#ece7dc;--muted:#a39d91}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Klee One",sans-serif;font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:24px;margin:0 0 6px}p.lead{color:var(--muted);margin:0 0 20px;line-height:1.7}
.row{display:flex;gap:10px;align-items:flex-start;padding:14px 0;border-top:1px solid rgba(0,0,0,.1);flex-wrap:wrap}
.who{width:150px;flex:none;display:flex;flex-direction:column;gap:6px}
.who img{width:96px;height:96px;object-fit:cover;border-radius:6px;outline:3px solid #e8a33d}
.ph{position:relative;width:150px;height:150px;border-radius:6px;overflow:hidden;cursor:pointer;background:#ddd}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.ng img{opacity:.25}.ph.ng::after{content:"✕ 違う";position:absolute;inset:0;display:grid;place-items:center;color:var(--ng);font-size:22px}
.ph .d{position:absolute;left:4px;bottom:3px;font-size:11px;color:#fff;text-shadow:0 1px 2px #000}
.allng{font-size:12px;border:1px solid var(--muted);background:transparent;color:var(--fg);border-radius:999px;padding:4px 10px;cursor:pointer;font-family:inherit}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid rgba(0,0,0,.15);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:center}
.bar button{font-family:inherit;font-size:16px;border:0;border-radius:999px;padding:12px 28px;background:var(--fg);color:var(--bg);cursor:pointer}
#st{color:var(--muted)}
.ph .ok,.ph .solo{position:absolute;top:4px;font-size:11px;color:#fff;padding:1px 6px;border-radius:999px}.ph .ok{left:4px;background:#2f7d4a}.ph .solo{right:4px;background:#c26a1b}
.ph .star{position:absolute;right:4px;bottom:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:16px;cursor:pointer}
.ph.first{outline:4px solid #e8a33d}.ph.first .star{background:#e8a33d}
.ph .no{position:absolute;left:4px;top:4px;font-size:11px;color:#fff;background:rgba(0,0,0,.5);padding:1px 6px;border-radius:999px}
.ph.ng .star{display:none}
.nav{position:sticky;top:0;background:var(--bg);z-index:3;padding:8px 0;display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
.nav a{color:var(--fg)}
.face{display:flex;gap:8px;align-items:center;padding:12px 0;border-top:1px solid rgba(0,0,0,.1);flex-wrap:wrap}.face img{width:120px;height:120px;object-fit:cover;border-radius:8px;background:#ddd}.face .meta{width:84px;font-size:13px;color:var(--muted)}.face select{font-family:inherit;font-size:15px;padding:8px;border-radius:8px;max-width:100%}.face.done{opacity:.55}
</style></head><body><div class="wrap">
<h1>この人だれ？</h1>
<p class="lead">写真によく出てくるのに、まだ名前が分からない顔です（写真の古い順）。<br>分かる人だけ名前を選んでください。名前は Slack に入った時期の古い順に並んでいます。<br>選んだ内容はこの端末に自動で保存されます。最後に「送信」を押してください。</p>
<div id="list">読み込んでいます…</div></div>
<div class="bar"><span id="st"></span><button id="send">送信</button></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwmzffnY-hwKJcy-DftwktmSfp2b22DRqWlML2y90UgYoNGGBSGqqqukoo53QsLBR-JQA/exec',KEY='radix10';
const get=p=>fetch(API+'?'+new URLSearchParams({...p,key:KEY})).then(r=>r.json());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SEL={};
(async()=>{const [d,w]=await Promise.all([get({action:'data'}),get({action:'photos',ids:'list:who2'})]);
 const U=JSON.parse(w.photos['list:who2']);
 const P=d.people.filter(p=>!p.cur&&!p.hide).sort((a,b)=>String((a.span||[])[0]).localeCompare(String((b.span||[])[0]))||a.n.localeCompare(b.n));
 const opts='<option value="">― 分からない ―</option><option value="__cur">現メンバー</option><option value="__other">名簿にいない人</option>'+P.map(p=>`<option value="${esc(p.n)}">${esc(p.n)}（${esc(String((p.span||[])[0]||'').replace('-','年'))}月〜）</option>`).join('');
 const list=document.getElementById('list');
 list.innerHTML=U.map((u,i)=>`<div class="face" data-i="${i}"><div class="meta">${esc(u[0].replace('-','年'))}月〜<br>写真${u[1]}枚</div>`+[...Array(u[2]).keys()].map(j=>`<img data-id="w2:${i}_${j}" alt="">`).join('')+`<select data-i="${i}">${opts}</select></div>`).join('');
 // restore: sent + draft
 try{const m=await get({action:'messages'});const sent=m.messages.filter(x=>x.to==='__review__'&&x.from==='dare').flatMap(x=>String(x.text).split(';'));let dr={};try{dr=JSON.parse(localStorage.getItem('dare_draft')||'{}')}catch(e){}
  for(const it of sent){const [t,i,n]=it.split('|');if(t==='W')SEL[i]=n}Object.assign(SEL,dr);
  for(const [i,n] of Object.entries(SEL)){const s=list.querySelector(`select[data-i="${i}"]`);if(s){s.value=n;s.closest('.face').classList.toggle('done',!!n)}}
  if(Object.keys(SEL).length)document.getElementById('st').textContent='前回の選択（'+Object.values(SEL).filter(Boolean).length+'件）を復元しました'}catch(e){}
 list.addEventListener('change',e=>{const s=e.target.closest('select');if(!s)return;SEL[s.dataset.i]=s.value;s.closest('.face').classList.toggle('done',!!s.value);try{localStorage.setItem('dare_draft',JSON.stringify(SEL))}catch(e){}});
 const ids=[...list.querySelectorAll('img[data-id]')].map(i=>i.dataset.id);
 for(let i=0;i<ids.length;i+=15){get({action:'photos',ids:ids.slice(i,i+15).join(',')}).then(x=>{for(const k in x.photos)list.querySelectorAll(`img[data-id="${k}"]`).forEach(im=>im.src=x.photos[k])})}
})();
document.getElementById('send').onclick=async()=>{const st=document.getElementById('st'),btn=document.getElementById('send');btn.disabled=true;st.style.color='';st.textContent='送信中…';
 const sid='S'+Date.now().toString(36);const items=Object.entries(SEL).filter(([i,n])=>n).map(([i,n])=>'W|'+i+'|'+n);
 const chunks=[];let cur='';for(const it of items){if((cur+';'+it).length>360){chunks.push(cur);cur=it}else cur=cur?cur+';'+it:it}chunks.push(cur||'none');
 let bad=0;for(const c of chunks){let ok=false;for(let t=0;t<5&&!ok;t++){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'post',key:KEY,to:'__review__',from:'dare',text:sid+';'+c})}).then(r=>r.json());ok=!!r.ok}catch(e){}if(!ok)await new Promise(r=>setTimeout(r,2500))}if(!ok)bad++}
 let got=0;try{const m=await get({action:'messages'});got=m.messages.filter(x=>x.to==='__review__'&&String(x.text).startsWith(sid+';')).flatMap(x=>String(x.text).split(';').slice(1)).filter(t=>t&&t!=='none').length}catch(e){}
 btn.disabled=false;if(bad||got<items.length){st.style.color='#d2392b';st.textContent='⚠ 届いたのは '+got+' / '+items.length+' 件です。もう一度「送信」を押してください';return}
 st.textContent='✓ 届きました（'+items.length+'人分）'};
</script></body></html>
